name: Deploy frontend

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production
        env:
          CI: false
        run: npm run build

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY_ED25519: ${{ secrets.DEPLOY_SSH_KEY_ED25519 }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY_ED25519" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H osflow.pt >> ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /tmp/deploy_public_key

      - name: Deploy build to app.osflow.pt
        run: |
          rsync -az -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" build/ osflowpt@osflow.pt:/home/osflowpt/app.osflow.pt/
